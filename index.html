<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Casio</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <div class="calculadora">
        <div class="marca">Casio</div>
        <input type="text" id="pantalla" readonly>
        
        <div class="botones">
            <button id="btn-c">C</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>

            <button>/</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>

            <button>*</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>

            <button>-</button>
            <button>0</button>
            <button>.</button>
            <button id="btn-igual">=</button>

            <button id="btn-suma">+</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
